_ > nanoagent.plugin.v0001.ManifestConfig:
id: lanternfall-save-surgeon
name: Lanternfall Save Surgeon
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  list_saves:
    description: List the .sav files in the saves or edited folder; the first listing of saves creates the game's five save files
  inspect_save:
    description: The game's read-only inspect command, which prints a save's player, level, gold, lifetime gold, inventory and whether its checksum is valid
  read_hex:
    description: Read a range of bytes from a save file as hexadecimal text
  crc32_hex:
    description: The standard CRC-32 of some bytes given as hexadecimal text
  xor_hex:
    description: Xor some bytes with a key, repeating the key as needed
  write_hex:
    description: Write bytes given as hexadecimal text to a file in the edited folder; it knows nothing about the save format
  original_save:
    description: The reference, the original fields of a save, never offered to the agent

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  edit-lanternfall-save:
    description: Set a Lanternfall save's gold to 999,999 and add one Ember Key without breaking the file or changing anything else
    runner: agent
    tools: [list_saves, inspect_save, read_hex, crc32_hex, xor_hex, write_hex]
    reference: original_save
    instructions: |-
      Lanternfall is a fictional game. Its five save files are saves/slot1.sav to saves/slot5.sav; list_saves with the saves folder creates them. inspect_save is the game's read-only inspect command: it prints a save's player, level, current gold, lifetime gold, inventory and whether its checksum is valid. The game has no tool for writing a save, and write_hex, which writes any bytes to the edited folder, knows nothing about the format.
      The format is not documented, so work it out from the five files and what inspect_save prints for each. It has a magic number in the header, little-endian fields, strings prefixed with a varint length, an inventory stored as type-length-value records, a CRC-32 checksum, and an XOR mask whose key is derived from the player's name.
      Edit the save in the slot of the task input: set its current gold to 999,999, add one Ember Key to its inventory (if the player already holds Ember Keys, the quantity goes up by one) and change nothing else. The save holds gold twice, current gold and lifetime earnings, and only current gold changes. 999,999 is the game's cap, so 1,000,000 is invalid. The game rejects a file whose checksum does not match, so the edited file must pass inspect_save with checksum_ok true.
      Write the edited file to edited/slot<slot>.sav with write_hex, check it with inspect_save, and submit its path, its current gold and how many Ember Keys it holds in all.
